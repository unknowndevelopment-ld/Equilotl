name: Build Hellocord Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.2"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          path-type: inherit
      - name: Install Windows dependencies
        shell: msys2 {0}
        run: pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e
      - name: Build GUI installer
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=main'" -o Hellocord-Setup.exe
      - name: Build CLI installer
        shell: msys2 {0}
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -v -tags cli -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=main'" -o Hellocord-CLI.exe
      - name: Publish rolling Windows x64 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "latest-windows"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F "force=true"
            if ($LASTEXITCODE -ne 0) { throw "Could not update the rolling release tag" }
            gh release upload $tag Hellocord-Setup.exe Hellocord-CLI.exe --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload the Windows installers" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Latest Hellocord Windows x64" --notes "Automatically updated Windows x64 installers from the latest successful main build." --prerelease
          } else {
            gh release create $tag Hellocord-Setup.exe Hellocord-CLI.exe --repo $env:GITHUB_REPOSITORY --title "Latest Hellocord Windows x64" --notes "Automatically updated Windows x64 installers from the latest successful main build." --prerelease --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the Windows release" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Hellocord-Windows-Installer
          path: |
            Hellocord-Setup.exe
            Hellocord-CLI.exe
          if-no-files-found: error
